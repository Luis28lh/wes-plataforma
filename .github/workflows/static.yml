name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Luis28lh/wes-plataforma'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar fuentes maestras
        run: |
          node proyecto-wes/scripts/sync_sources.js

      - name: Compilar Tailwind CSS de Producción
        run: |
          npx tailwindcss@3.4.17 -i src/input.css -o css/tailwind.min.css --minify
          mkdir -p proyecto-wes/css
          cp css/tailwind.min.css proyecto-wes/css/tailwind.min.css

      - name: Ejecutar Suite de Bloqueos Automáticos (Preflight)
        run: |
          node scripts/verify_preflight.js

      - name: Prepare WES site
        run: |
          mkdir -p _site
          cp -r ./proyecto-wes/* _site/
          touch _site/.nojekyll
          echo "web.warnelectricalservices.com" > _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
